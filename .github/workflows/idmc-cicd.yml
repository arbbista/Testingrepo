# ---------------------------------------------------------------------------
# CI/CD for Informatica IDMC - Cloud Data Integration (CDI)
#
# Flow:
#   1. Developers build in the IDMC DEV org and "Check In" to GitHub.
#   2. A pull request into `main` runs the CI checks below.
#   3. Merging into `main` deploys that commit to the QA org automatically.
#   4. The same commit is deployed to PROD after a reviewer approves.
#
# One-time setup in GitHub (Settings -> Environments):
#   Create two environments: `qa` and `prod`.
#   Add "Required reviewers" on `prod` (this is the approval gate).
#   In EACH environment add:
#     Secrets:   IDMC_USERNAME, IDMC_PASSWORD   (a dedicated service user)
#     Variables: IDMC_POD_URL                   e.g. https://dm-us.informaticacloud.com
#                IDMC_SMOKE_TASK_ID             (optional) federated ID of a task to run after deploy
#                IDMC_SMOKE_TASK_TYPE           (optional) MTT, DSS, WORKFLOW ... default MTT
#
# One-time setup in IDMC:
#   The DEV org is linked to this repository on a working branch (e.g. `develop`).
#   The QA and PROD orgs are linked to this repository on branch `main`.
#   The service user has its GitHub token saved in its IDMC profile.
#   Connections and runtime environments exist in every org with the SAME names.
#
# Tip: use "Squash and merge" for PRs so every merge to `main` is ONE commit
# that contains all changed assets. That commit is what gets deployed.
# ---------------------------------------------------------------------------

name: IDMC CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      commit_hash:
        description: "Commit to deploy (leave empty for the latest commit on main)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # CI: runs on every pull request. Nothing is deployed here.
  # -------------------------------------------------------------------------
  validate:
    name: Validate assets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List changed IDMC assets
        run: |
          echo "## Changed assets in this PR" >> "$GITHUB_STEP_SUMMARY"
          git diff --name-status "origin/${{ github.base_ref }}...HEAD" \
            | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Check that all JSON files are valid
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if ! jq empty "$f" 2>/dev/null; then
              echo "::error file=$f::Invalid JSON"
              status=1
            fi
          done < <(find . -name '*.json' -not -path './.git/*' -print0)
          exit $status

      - name: Warn about possible hard-coded passwords
        run: |
          if grep -rIln --include='*.json' -iE '"password"\s*:\s*"[^"*]+' . ; then
            echo "::warning::Possible hard-coded password in the files above. Use connections or parameters instead."
          fi

  # -------------------------------------------------------------------------
  # CD: deploy to QA automatically after merge to main.
  # -------------------------------------------------------------------------
  deploy-qa:
    name: Deploy to QA
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: qa
    concurrency: idmc-qa
    env:
      COMMIT_HASH: ${{ inputs.commit_hash || github.sha }}
      IDMC_POD_URL: ${{ vars.IDMC_POD_URL }}
      IDMC_USERNAME: ${{ secrets.IDMC_USERNAME }}
      IDMC_PASSWORD: ${{ secrets.IDMC_PASSWORD }}
    steps:
      - name: Log in to IDMC
        run: |
          resp=$(curl -sS --fail-with-body -X POST "$IDMC_POD_URL/saas/public/core/v3/login" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -d "$(jq -n --arg u "$IDMC_USERNAME" --arg p "$IDMC_PASSWORD" '{username:$u, password:$p}')")
          session=$(echo "$resp" | jq -r '.userInfo.sessionId')
          base=$(echo "$resp" | jq -r '.products[0].baseApiUrl')
          if [ -z "$session" ] || [ "$session" = "null" ]; then
            echo "::error::Login failed"; exit 1
          fi
          echo "::add-mask::$session"
          echo "IDMC_SESSION=$session" >> "$GITHUB_ENV"
          echo "IDMC_BASE=$base" >> "$GITHUB_ENV"

      - name: Pull commit ${{ env.COMMIT_HASH }} into QA
        run: |
          resp=$(curl -sS --fail-with-body -X POST "$IDMC_BASE/public/core/v3/pullByCommitHash" \
            -H "INFA-SESSION-ID: $IDMC_SESSION" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -d "{\"commitHash\": \"$COMMIT_HASH\"}")
          action_id=$(echo "$resp" | jq -r '.pullActionId')
          if [ -z "$action_id" ] || [ "$action_id" = "null" ]; then
            echo "::error::Pull request was not accepted: $resp"; exit 1
          fi
          echo "Pull action: $action_id"

          for i in $(seq 1 60); do
            state=$(curl -sS --fail-with-body \
              "$IDMC_BASE/public/core/v3/sourceControlAction/$action_id" \
              -H "INFA-SESSION-ID: $IDMC_SESSION" -H "Accept: application/json" \
              | jq -r '.status.state')
            echo "State: $state"
            case "$state" in
              SUCCESSFUL) exit 0 ;;
              WARNING)    echo "::warning::Pull finished with warnings. Check Monitor -> Source Control Logs."; exit 0 ;;
              FAILED)     echo "::error::Pull failed. Check Monitor -> Source Control Logs in the QA org."; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for the pull to finish"; exit 1

      - name: Smoke test (optional)
        if: vars.IDMC_SMOKE_TASK_ID != ''
        env:
          TASK_ID: ${{ vars.IDMC_SMOKE_TASK_ID }}
          TASK_TYPE: ${{ vars.IDMC_SMOKE_TASK_TYPE || 'MTT' }}
        run: |
          job=$(curl -sS --fail-with-body -X POST "$IDMC_BASE/api/v2/job" \
            -H "icSessionId: $IDMC_SESSION" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -d "{\"@type\":\"job\",\"taskFederatedId\":\"$TASK_ID\",\"taskType\":\"$TASK_TYPE\"}")
          v2_task_id=$(echo "$job" | jq -r '.taskId')
          run_id=$(echo "$job" | jq -r '.runId')
          echo "Started task, run $run_id"

          for i in $(seq 1 60); do
            log=$(curl -sS --fail-with-body \
              "$IDMC_BASE/api/v2/activity/activityLog?taskId=$v2_task_id&runId=$run_id" \
              -H "icSessionId: $IDMC_SESSION" -H "Accept: application/json")
            if [ "$(echo "$log" | jq 'length')" -gt 0 ]; then
              state=$(echo "$log" | jq -r '.[0].state')   # 1=success 2=warning 3=failed
              echo "Run finished with state $state"
              if [ "$state" = "3" ]; then
                echo "::error::Smoke test failed. Check Monitor -> All Jobs in the QA org."; exit 1
              fi
              exit 0
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for the smoke test"; exit 1

      - name: Log out
        if: always() && env.IDMC_SESSION != ''
        run: |
          curl -sS -X POST "$IDMC_BASE/public/core/v3/logout" \
            -H "INFA-SESSION-ID: $IDMC_SESSION" || true

  # -------------------------------------------------------------------------
  # CD: deploy the SAME commit to PROD, after a reviewer approves.
  # (The approval comes from "Required reviewers" on the `prod` environment.)
  # -------------------------------------------------------------------------
  deploy-prod:
    name: Deploy to PROD
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: prod
    concurrency: idmc-prod
    env:
      COMMIT_HASH: ${{ inputs.commit_hash || github.sha }}
      IDMC_POD_URL: ${{ vars.IDMC_POD_URL }}
      IDMC_USERNAME: ${{ secrets.IDMC_USERNAME }}
      IDMC_PASSWORD: ${{ secrets.IDMC_PASSWORD }}
    steps:
      - name: Log in to IDMC
        run: |
          resp=$(curl -sS --fail-with-body -X POST "$IDMC_POD_URL/saas/public/core/v3/login" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -d "$(jq -n --arg u "$IDMC_USERNAME" --arg p "$IDMC_PASSWORD" '{username:$u, password:$p}')")
          session=$(echo "$resp" | jq -r '.userInfo.sessionId')
          base=$(echo "$resp" | jq -r '.products[0].baseApiUrl')
          if [ -z "$session" ] || [ "$session" = "null" ]; then
            echo "::error::Login failed"; exit 1
          fi
          echo "::add-mask::$session"
          echo "IDMC_SESSION=$session" >> "$GITHUB_ENV"
          echo "IDMC_BASE=$base" >> "$GITHUB_ENV"

      - name: Pull commit ${{ env.COMMIT_HASH }} into PROD
        run: |
          resp=$(curl -sS --fail-with-body -X POST "$IDMC_BASE/public/core/v3/pullByCommitHash" \
            -H "INFA-SESSION-ID: $IDMC_SESSION" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -d "{\"commitHash\": \"$COMMIT_HASH\"}")
          action_id=$(echo "$resp" | jq -r '.pullActionId')
          if [ -z "$action_id" ] || [ "$action_id" = "null" ]; then
            echo "::error::Pull request was not accepted: $resp"; exit 1
          fi
          echo "Pull action: $action_id"

          for i in $(seq 1 60); do
            state=$(curl -sS --fail-with-body \
              "$IDMC_BASE/public/core/v3/sourceControlAction/$action_id" \
              -H "INFA-SESSION-ID: $IDMC_SESSION" -H "Accept: application/json" \
              | jq -r '.status.state')
            echo "State: $state"
            case "$state" in
              SUCCESSFUL) exit 0 ;;
              WARNING)    echo "::warning::Pull finished with warnings. Check Monitor -> Source Control Logs."; exit 0 ;;
              FAILED)     echo "::error::Pull failed. Check Monitor -> Source Control Logs in the PROD org."; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for the pull to finish"; exit 1

      - name: Log out
        if: always() && env.IDMC_SESSION != ''
        run: |
          curl -sS -X POST "$IDMC_BASE/public/core/v3/logout" \
            -H "INFA-SESSION-ID: $IDMC_SESSION" || true
